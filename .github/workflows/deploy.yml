name: Despliegue

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */2 * * *' # cada 2 h, en el minuto 17: la hora en punto es cuando más se retrasan las ejecuciones programadas
  workflow_dispatch:
    inputs:
      refresh:
        description: 'Descargar datos nuevos de CelesTrak (si no, se reutilizan los publicados)'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez, y uno en marcha no se cancela: cortarlo a medias dejaría el sitio a medio publicar.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - id: pages
        uses: actions/configure-pages@v6
      - run: npm ci
      - run: npm test
      - name: Datos
        env:
          EVENT: ${{ github.event_name }}
          INPUT_REFRESH: ${{ inputs.refresh }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: scripts/ci-data.sh
      - name: Construir
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
